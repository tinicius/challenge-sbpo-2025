      shake_adaptive: true
      max_iterations: 50
      greedy: simple
      seed: 42

  # ---- Larger neighbor cap (more thorough search) ----
  - name: ils_large_neighbor_cap
    algo: ils
    deterministic: false
    params:
      initial_heuristic: seed
      ls_operators: [swap, add, remove]
      ls_strategy: first_improvement
      ls_max_iterations: 100
      neighbor_cap: 100
      shake_k: 3
      shake_adaptive: true
