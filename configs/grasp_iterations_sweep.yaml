# GRASP iterations sweep (OFAT)
# Varies: max_iterations ∈ {1, 5, 10, 20, 50, 100}
# Fixed baseline: alpha=0.3, construction_score=size, greedy=multi,
#                 local_search=none, similarity_weighted=false
# Answers: where does the diminishing-returns curve flatten?

instance_dir: datasets/a
repetitions: 5
seed_base: 42
max_workers: null
time_limit: 20
result_dir: results
save_output: true

algorithms:
  - name: grasp_iter_i001
    algo: grasp
    params:
      alpha: 0.3
      construction_score: size
      max_iterations: 1
      greedy: multi
      local_search: none

  - name: grasp_iter_i005
    algo: grasp
    params:
      alpha: 0.3
      construction_score: size
      max_iterations: 5
      greedy: multi
      local_search: none

