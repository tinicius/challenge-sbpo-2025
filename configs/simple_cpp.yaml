# Experiment configuration for the SBPO 2025 Wave Order-Picking Challenge

# Dataset to run experiments on
instance_dir: datasets/a

# Number of repetitions per (algorithm, instance) pair
repetitions: 30

# Base seed for reproducibility (run i uses seed_base + i)
seed_base: 42

# Maximum number of parallel workers (null = cpu_count - 1)
max_workers: null

# Time limit per solver run in seconds (null = no limit)
time_limit: 90

# Output directory for results
result_dir: results

# Save problem output (selected orders and aisles) to CSV (default: false)
save_output: True

algorithms:
  # --- Greedy heuristics ---

  # Size / random based

  - name: random
    algo: simple_cpp
    params:
      greedy: simple

  - name: random_multi
    algo: simple_cpp
    params:
      greedy: multi

  - name: smaller
    algo: simple_cpp
    deterministic: True
    params:
      order: asc
      greedy: simple

  - name: smaller_multi
    algo: simple_cpp
    deterministic: True
    params:
      order: asc
      greedy: multi

  - name: bigger
    algo: simple_cpp
    deterministic: True
    params:
      order: desc
      greedy: simple

  - name: bigger_multi
    algo: simple_cpp
    deterministic: True
    params:
      order: desc
      greedy: multi

  # Similarity based (unweighted Jaccard over item keys)

  - name: similar
    algo: simple_cpp
    params:
      greedy: simple
      order: similar

  - name: similar_multi
    algo: simple_cpp
    params:
      greedy: multi
      order: similar

  - name: similar_smaller
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: similar
      first_order: smaller

  - name: similar_smaller_multi
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: similar
      first_order: smaller

  - name: similar_bigger
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: similar
      first_order: bigger

  - name: similar_bigger_multi
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: similar
      first_order: bigger

  # Diff based (least similar first)

  - name: diff
    algo: simple_cpp
    params:
      greedy: simple
      order: diff

  - name: diff_multi
    algo: simple_cpp
    params:
      greedy: multi
      order: diff

  - name: diff_smaller
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: diff
      first_order: smaller

  - name: diff_smaller_multi
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: diff
      first_order: smaller

  - name: diff_bigger
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: diff
      first_order: bigger

  - name: diff_bigger_multi
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: diff
      first_order: bigger

  # Similarity based (weighted Jaccard over item quantities)

  - name: similar_weighted
    algo: simple_cpp
    params:
      greedy: simple
      order: similar
      similarity_weighted: true

  - name: similar_multi_weighted
    algo: simple_cpp
    params:
      greedy: multi
      order: similar
      similarity_weighted: true

  - name: similar_smaller_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: similar
      first_order: smaller
      similarity_weighted: true

  - name: similar_smaller_multi_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: similar
      first_order: smaller
      similarity_weighted: true

  - name: similar_bigger_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: similar
      first_order: bigger
      similarity_weighted: true

  - name: similar_bigger_multi_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: similar
      first_order: bigger
      similarity_weighted: true

  # Diff based (weighted Jaccard over item quantities)

  - name: diff_weighted
    algo: simple_cpp
    params:
      greedy: simple
      order: diff
      similarity_weighted: true

  - name: diff_multi_weighted
    algo: simple_cpp
    params:
      greedy: multi
      order: diff
      similarity_weighted: true

  - name: diff_smaller_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: diff
      first_order: smaller
      similarity_weighted: true

  - name: diff_smaller_multi_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: diff
      first_order: smaller
      similarity_weighted: true

  - name: diff_bigger_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: simple
      order: diff
      first_order: bigger
      similarity_weighted: true

  - name: diff_bigger_multi_weighted
    algo: simple_cpp
    deterministic: True
    params:
      greedy: multi
      order: diff
      first_order: bigger
      similarity_weighted: true
