  # Exact-order variant: replaces the greedy pack_orders step with a CP-SAT
  # ILP that maximises total units for the fixed aisle prefix at each k.
  # `order` only affects the fallback when the ILP can't find a feasible
  # solution within `time_limit_per_k`, so we fix it to `desc` and grid only
  # over score × prune.
  - name: afe_useful_prune-null
    algo: aisle_first_exact
    deterministic: true
    params:
      score: useful
      order: desc
      prune: null
      time_limit_per_k: 2.0
      total_time_limit: 60.0
  - name: afe_useful_prune-simple
    algo: aisle_first_exact
    deterministic: true
    params:
      score: useful
      order: desc
      prune: simple
