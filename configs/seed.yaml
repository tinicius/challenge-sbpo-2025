# Experiment configuration for the SBPO 2025 Wave Order-Picking Challenge
# Canonical de Koster (1999) seed heuristic

instance_dir: datasets/a
repetitions: 5
seed_base: 42
max_workers: null
time_limit: 90
result_dir: results
save_output: true

algorithms:
  - name: seed_de_koster
    algo: seed
    deterministic: true
    params:
      greedy: simple

  - name: seed_de_koster_multi
    algo: seed
    deterministic: true
    params:
      greedy: multi