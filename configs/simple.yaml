# Experiment configuration for the SBPO 2025 Wave Order-Picking Challenge

# Dataset to run experiments on
instance_dir: datasets/x

# Number of repetitions per (algorithm, instance) pair
repetitions: 5

# Base seed for reproducibility (run i uses seed_base + i)
seed_base: 42

# Maximum number of parallel workers (null = cpu_count - 1)
max_workers: null

# Time limit per solver run in seconds (null = no limit)
time_limit: 90

# Output directory for results
result_dir: results

# Save problem output (selected orders and aisles) to CSV (default: false)
save_output: true

algorithms:

  - name: simple_random_simple_exact_false
    algo: simple
    deterministic: false
    params:
      order: null
      greedy: simple
      exact: false

  - name: simple_random_simple_exact_true
    algo: simple
    deterministic: false
    params:
      order: null
      greedy: simple
      exact: true

