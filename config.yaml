# Experiment configuration for the SBPO 2025 Wave Order-Picking Challenge

# Dataset to run experiments on
instance_dir: datasets/a

# Number of repetitions per (algorithm, instance) pair
repetitions: 30

# Base seed for reproducibility (run i uses seed_base + i)
seed_base: 42

# Maximum number of parallel workers (null = cpu_count - 1)
max_workers: null

# Time limit per solver run in seconds (null = no limit)
time_limit: 20

# Output directory for results
result_dir: results

# Save problem output (selected orders and aisles) to CSV (default: false)
save_output: True

algorithms:
  # --- Greedy heuristics ---

  # Simple greedy heuristic

  - name: random
    algo: simple
    params:
      greedy: simple

  - name: random_multi
    algo: simple
    params:
      greedy: multi

  - name: smaller
    algo: simple
    deterministic: True
    params:
      order: asc
      greedy: simple

  - name: smaller_multi
    algo: simple
    deterministic: True
    params:
      order: asc
      greedy: multi

  - name: bigger
    algo: simple
    deterministic: True
    params:
      order: desc
      greedy: simple

  - name: bigger_multi
    algo: simple
    deterministic: True
    params:
      order: desc
      greedy: multi

  # Similarity-based heuristic

  - name: similar
    algo: similar
    params:
      greedy: simple
      reverse: True

  - name: similar_multi
    algo: similar
    params:
      greedy: multi
      reverse: True
    
  - name: similar_smaller
    algo: similar
    deterministic: True
    params:
      greedy: simple
      first_order: smaller
      reverse: True

  - name: similar_smaller_multi
    algo: similar
    deterministic: True
    params:
      greedy: multi
      first_order: smaller
      reverse: True

  - name: similar_bigger
    algo: similar
    deterministic: True
    params:
      greedy: simple
      first_order: bigger
      reverse: True

  - name: similar_bigger_multi
    algo: similar
    deterministic: True
    params:
      greedy: multi
      first_order: bigger
      reverse: True

  # Diff-based heuristic

  - name: diff
    algo: similar
    params:
      greedy: simple
      reverse: False

  - name: diff_multi
    algo: similar
    params:
      greedy: multi
      reverse: False

  - name: diff_smaller
    algo: similar
    deterministic: True
    params:
      greedy: simple
      first_order: smaller
      reverse: False

  - name: diff_smaller_multi
    algo: similar
    deterministic: True
    params:
      greedy: multi
      first_order: smaller
      reverse: False

  - name: diff_bigger
    algo: similar
    deterministic: True
    params:
      greedy: simple
      first_order: bigger
      reverse: False

  - name: diff_bigger_multi
    algo: similar
    deterministic: True
    params:
      greedy: multi
      first_order: bigger
      reverse: False


  
