# Experiment configuration for the SBPO 2025 Wave Order-Picking Challenge

# Dataset to run experiments on
instance_dir: datasets/a

# Number of repetitions per (algorithm, instance) pair
repetitions: 1

# Base seed for reproducibility (run i uses seed_base + i)
seed_base: 42

# Maximum number of parallel workers (null = cpu_count - 1)
max_workers: null

# Time limit per solver run in seconds (null = no limit)
time_limit: 10

# Output directory for results
result_dir: results

# Save problem output (selected orders and aisles) to CSV (default: false)
save_output: True

algorithms:
  # --- Greedy heuristics ---
  - name: simple
    algo: simple
    params:
      greedy: simple

  - name: simple_multi
    algo: simple
    params:
      greedy: multi

  - name: similar
    algo: similar
    params:
      greedy: simple
      reverse: True

  - name: similar_multi
    algo: similar
    params:
      greedy: multi
      reverse: True

  - name: diff
    algo: similar
    params:
      greedy: simple
      reverse: False

  - name: diff_multi
    algo: similar
    params:
      greedy: multi
      reverse: False

  - name: aisle_first_desc
    algo: aisle_first
    params:
      max_k: 5
      order_strategy: size_desc

  - name: aisle_first_asc
    algo: aisle_first
    params:
      max_k: 5
      order_strategy: size_asc

  - name: aisle_first_random
    algo: aisle_first
    params:
      max_k: 5
      order_strategy: random

  - name: aisle_cluster_expansion
    algo: aisle_cluster_expansion
    # params:
    #   attempts: null
    #   max_added_aisles: null

  - name: lagrangian_relaxation

  - name: column_generation
    algo: column_generation
    params:
      initial_pool_size: 5
      max_cg_iterations: 50
      max_columns_per_iter: 5

  - name: min_aisle_cover
  
  - name: greedy_set_cover
    algo: greedy_set_cover

  - name: lp_aisle_focus
    algo: lp_aisle_focus

  - name: lagrangian_relaxation
    algo: lagrangian_relaxation
