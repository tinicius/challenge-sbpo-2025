# Experiment configuration for the SBPO 2025 Wave Order-Picking Challenge

# Dataset to run experiments on
instance_dir: datasets/a

# Number of repetitions per (algorithm, instance) pair
repetitions: 1

# Base seed for reproducibility (run i uses seed_base + i)
seed_base: 42

# Maximum number of parallel workers (null = cpu_count - 1)
max_workers: null

# Time limit per solver run in seconds (null = no limit)
time_limit: 180

# Output directory for results
result_dir: results

# Save problem output (selected orders and aisles) to CSV (default: false)
save_output: True

algorithms:
  - name: bigger_exact
    algo: simple
    deterministic: True
    params:
      order: desc
      greedy: simple
      exact: true

  - name: bigger_multi
    algo: simple
    deterministic: True
    params:
      order: desc
      greedy: multi

  - name: pan_liu_sd2_oa2
    algo: pan_liu
    deterministic: true
    params: { seed_rule: SD2, add_rule: OA2, greedy: simple }

  - name: pan_liu_sd4_oa2
    algo: pan_liu
    deterministic: true
    params: { seed_rule: SD4, add_rule: OA2, greedy: simple }

  - name: af_useful_order-desc_prune-multi
    algo: aisle_first
    deterministic: true
    params:
      score: useful
      order: desc
      prune: multi

  - name: af_useful_order-null_prune-multi
    algo: aisle_first
    params:
      score: useful
      order: null
      prune: multi

  - name: ils_seed
    algo: ils
    deterministic: false
    params:
      initial_heuristic: seed
      ls_operators: [swap, add, remove]
      ls_strategy: first_improvement
      ls_max_iterations: 100
      neighbor_cap: 50
      shake_k: 3
      shake_adaptive: true
      max_iterations: 50
      greedy: simple

  - name: ils_simple
    algo: ils
    deterministic: false
    params:
      initial_heuristic: simple
      ls_operators: [swap, add, remove]
      ls_strategy: first_improvement
      ls_max_iterations: 100
      neighbor_cap: 50
      shake_k: 3
      shake_adaptive: true
      max_iterations: 50
      greedy: multi

  - name: ils_aisle_first
    algo: ils
    deterministic: false
    params:
      initial_heuristic: aisle_first
      ls_operators: [swap, add, remove]
      ls_strategy: first_improvement
      ls_max_iterations: 100
      neighbor_cap: 50
      shake_k: 3
      shake_adaptive: true
      max_iterations: 50
      greedy: multi