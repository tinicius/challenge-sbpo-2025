# GRASP construction_score sweep (OFAT)
# Varies: construction_score ∈ {size, synergy, aisle_cost, aisle_cost_fast}
# Fixed baseline: alpha=0.3, max_iterations=20, greedy=multi,
#                 local_search=none, similarity_weighted=false
# Answers: do expensive scorings pay off vs cheap 'size'?

instance_dir: datasets/a
repetitions: 5
seed_base: 42
max_workers: null
time_limit: 90
result_dir: results
save_output: true

algorithms:
  - name: grasp_cons_size
    algo: grasp
    params:
      alpha: 0.3
      construction_score: size
      max_iterations: 20
      greedy: multi
      local_search: none

  - name: grasp_cons_synergy
    algo: grasp
    params:
      alpha: 0.3
      construction_score: synergy
      max_iterations: 20
      greedy: multi
      local_search: none
      similarity_weighted: false

  - name: grasp_cons_aisle
    algo: grasp
    params:
      alpha: 0.3
      construction_score: aisle_cost
      max_iterations: 20
      greedy: multi
      local_search: none

  - name: grasp_cons_aisle_fast
    algo: grasp
    params:
      alpha: 0.3
      construction_score: aisle_cost_fast
      max_iterations: 20
      greedy: multi
      local_search: none
